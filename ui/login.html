<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerOps Login</title>
  <link rel="stylesheet" href="/src/login.css" />
</head>

<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">CareerOps</div>
      <p class="login-context">CareerOps Platform</p>
      <h1>Sign in to continue</h1>

      <form method="POST" action="/api/auth/login" class="login-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button id="loginBtn" type="submit">Login</button>

        <button id="guestLogin" type="button" style="display:none;">
          Continue as Guest
        </button>
      </form>
      <p id="guestError" role="alert" hidden></p>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      let isDemo = false;
      try {
        const response = await fetch("/version", { cache: "no-store" });
        if (response.ok) isDemo = (await response.json()).environment === "demo";
      } catch { /* Keep ordinary login if runtime identity is unavailable. */ }

      const loginBtn = document.getElementById("loginBtn");
      const guestBtn = document.getElementById("guestLogin");
      const emailGroup = document.getElementById("email")?.closest(".input-group");
      const passwordGroup = document.getElementById("password")?.closest(".input-group");

      if (isDemo) {
        if (loginBtn) loginBtn.style.display = "none";
        if (emailGroup) emailGroup.style.display = "none";
        if (passwordGroup) passwordGroup.style.display = "none";
        if (guestBtn) guestBtn.style.display = "block";
      }

      guestBtn?.addEventListener("click", async () => {
        const errorMessage = document.getElementById("guestError");
        errorMessage.hidden = true;
        guestBtn.disabled = true;
        guestBtn.textContent = "Logging in...";

        try {
          const res = await fetch("/api/auth/me", { credentials: "same-origin" });
          if (!res.ok) throw new Error("Guest session request failed");
          const data = await res.json();
          if (data.app_env !== "demo" || data.user?.role !== "guest") {
            throw new Error("DEMO guest session not established");
          }
          window.location.href = "/";
        } catch (err) {
          console.error(err);
          guestBtn.disabled = false;
          guestBtn.textContent = "Continue as Guest";
          errorMessage.textContent = "Guest access is temporarily unavailable. Please try again.";
          errorMessage.hidden = false;
        }
      });
    });
  </script>
</body>
</html>
