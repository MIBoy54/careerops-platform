name: CareerOps CI

on:
  push:
    branches:
      - dev
      - develop
      - qa
      - demo
      - main
  pull_request:
    branches:
      - dev
      - develop
      - qa
      - demo
      - main
      - transfer/careerops-reviewed-bcd81cc

jobs:
  quality-gate:
    name: CareerOps Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run SQL Regression
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mysql_image='mysql@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7'
          docker run -d \
            --name careerops-trend-dev-test \
            --network none \
            --tmpfs /var/lib/mysql \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            "$mysql_image"

          trap 'docker rm -f careerops-trend-dev-test >/dev/null 2>&1 || true' EXIT

          bash .github/scripts/wait-for-mysql-final-server.sh \
            careerops-trend-dev-test 8.4.13 120

          SESSION_TREND_TEST_MYSQL=1 npx vitest run --config tests/sessionTrend.config.js tests/regression/sessionTrendSql.test.js
          SNAPSHOT_TEST_MYSQL=1 npx vitest run --config tests/snapshotSql.config.js
          bash scripts/test-workflow-migration.sh

      - name: Run Unit Tests (DEV Gate)
        run: npx vitest run tests/unit

      - name: Install Playwright Browsers
        if: github.event_name == 'pull_request' || github.ref_name == 'qa' || github.ref_name == 'demo' || github.ref_name == 'main'
        run: npx playwright install --with-deps

      - name: Run Enabled Snapshot Browser Acceptance
        if: github.event_name == 'pull_request' || github.ref_name == 'qa' || github.ref_name == 'demo' || github.ref_name == 'main'
        env:
          SNAPSHOT_BROWSER_ACCEPTANCE: '1'
        run: npx vitest run tests/unit/environmentRoutes.test.js -t "serves enabled snapshot browser flow"

      - name: Run Employer Workflow Browser Acceptance
        if: github.event_name == 'pull_request' || github.ref_name == 'qa' || github.ref_name == 'demo' || github.ref_name == 'main'
        run: npx playwright test --config tests/workflow.playwright.config.js --workers=1

      - name: Run Smoke Tests (QA Gate)
        if: github.event_name == 'pull_request' || github.ref_name == 'qa' || github.ref_name == 'demo' || github.ref_name == 'main'
        env:
          TEST_EMAIL: test@careerops.local
          TEST_PASSWORD: test-password
        run: npx playwright test tests/e2e/smoke --workers=1

      - name: Run E2E Tests (DEMO/LIVE Gate)
        if: github.ref_name == 'demo' || github.ref_name == 'main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          TEST_EMAIL: test@careerops.local
          TEST_PASSWORD: test-password
        # Existing weekly-report-history exclusion retained; review before release.
        run: npx playwright test tests/e2e --workers=1 --grep-invert "Generated weekly report appears in Weekly Report History"
