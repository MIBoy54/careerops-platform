name: CareerOps CI

on:
  push:
    branches:
      - dev
      - develop
      - qa
      - demo
      - main
  pull_request:
    branches:
      - dev
      - develop
      - qa
      - demo
      - main

jobs:
  quality-gate:
    name: CareerOps Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Session Trend SQL Regression
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name careerops-trend-dev-test \
            --network none \
            --tmpfs /var/lib/mysql \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            mysql:8.4

          trap 'docker rm -f careerops-trend-dev-test >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in {1..60}; do
            if docker exec careerops-trend-dev-test mysqladmin ping -uroot --silent >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Disposable MySQL container did not become ready"
            exit 1
          fi

          SESSION_TREND_TEST_MYSQL=1 npx vitest run --config tests/sessionTrend.config.js tests/regression/sessionTrendSql.test.js

      - name: Run Unit Tests (DEV Gate)
        run: npx vitest run tests/unit

      - name: Install Playwright Browsers
        if: github.event_name == 'pull_request' || github.ref_name == 'qa' || github.ref_name == 'demo' || github.ref_name == 'main'
        run: npx playwright install --with-deps

      - name: Run Smoke Tests (QA Gate)
        if: github.event_name == 'pull_request' || github.ref_name == 'qa' || github.ref_name == 'demo' || github.ref_name == 'main'
        env:
          TEST_EMAIL: test@careerops.local
          TEST_PASSWORD: test-password
        run: npx playwright test tests/e2e/smoke --workers=1

      - name: Run E2E Tests (DEMO/LIVE Gate)
        if: github.ref_name == 'demo' || github.ref_name == 'main'
        env:
          TEST_EMAIL: test@careerops.local
          TEST_PASSWORD: test-password
        run: npx playwright test tests/e2e --workers=1 --grep-invert "Generated weekly report appears in Weekly Report History"
